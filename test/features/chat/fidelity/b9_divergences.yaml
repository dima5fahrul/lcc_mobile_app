# B9b — measured divergences between the Flutter port and `lcc-app` at
# `62f8a529aaa024a8b35b0af50a8fbd4850a63962`.
#
# specs.md § 6.8 requires the first entry below to exist "by name, with both
# citations", and B9-AC-26 makes reporting Tier 0 equality **without** this
# record a FAIL. The rest are here for the same reason: a divergence that is
# recorded is a known cost, and one that is absorbed into a PASS is the failure
# mode FACTORY-RULES' Capability Rule exists to catch.
#
# Most of this file is RECORDED, NOT FIXED, and each entry names who owns the fix
# and what it would cost. B9B-DIV-7 is the exception: half of it was fixed
# inside B9b's own scope, and the entry says which half and why.

artefact: b9b-divergences
batch: "B9b — Chat (roadmap.md § B9)"
web_commit: 62f8a529aaa024a8b35b0af50a8fbd4850a63962
