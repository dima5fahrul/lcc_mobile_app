  - id: B9B-DIV-7
    title: >-
      Dart's ISO parser accepts legacy/loose formats JS accepts, and rejects
      some JS accepts — the residue after the rollover guard
    severity: informational
    tier_visibility: NONE — no observed payload reaches either branch.
    found_by: measurement, and it CORRECTED A PREMISE IN specs.md § 6.13
    the_premise_that_was_wrong: >-
      § 6.13 frames the whole `clockTime` difficulty as "a Dart `DateTime.parse`
      on a malformed string THROWS where JS yields NaN", which makes `tryParse`
      look like the complete answer. Measured, it is not: Dart's parser ROLLS
      OUT-OF-RANGE COMPONENTS OVER rather than rejecting them, so
      `2026-02-30T10:00:00Z` becomes March 2nd and `2026-13-45T99:99:99` becomes
      February 2027 — both of which are `Invalid Date` in ECMAScript and render
      `""` in the source. A tryParse-only port prints a plausible, WRONG time
      where the web prints nothing, which is quieter than a crash and harder to
      notice.
    fixed_not_recorded: >-
      This half IS fixed, inside B9b's own scope:
      `clock_time.dart`'s `_componentsSurvivedParsing` compares the calendar
      fields written in the string against the ones the parser returned, so the
      port now renders `""` for both. Asserted in `clock_time_test.dart`,
      including the 2024-02-29 / 2026-02-29 leap-year pair, which is the sharpest
      evidence the check reads the parser's output rather than the string.
    what_remains_open: >-
      The OTHER direction. ECMAScript falls back to implementation-defined
      parsing for non-ISO forms, so `new Date("Aug 13 2026")` is a real date in
      a browser and `DateTime.tryParse` returns null for it — the web would
      render a time and the port renders `""`. Implementing JS's legacy date
      parser is plainly out of scope, and `types.ts:744` types `sent_at` as an
      ISO timestamp, so nothing on the wire reaches it.
    owner: >-
      nobody, unless the backend ever sends a non-ISO timestamp — at which point
      the correct fix is on the wire, not in a formatter


  - id: B9B-DIV-8
    title: >-
      The soft keyboard shrinks the panel's HEIGHT here and covers its BOTTOM on
      the web — the 520 dp cap is clamped where 520 dp does not exist
    severity: low
    tier_visibility: >-
      NONE, and that is the whole reason this record exists. Tier 0 compares
      request bodies, Tier 1 compares ordered text, Tier 2 compares colour, and
      Tier 3 has no reference for any open chat state (§ 6.10). No tier in this
      programme observes a rect, so the defect this entry documents shipped past
      1,376 tests and a clean release build.
    found_by: >-
      architecture-review.md § 2 BLOCKER-1, by direct measurement — the
      architect's own § 6.4 seam ruling caused it and the same review ruled the
      remedy.
    web:
      citation: "CustomerServiceChat.tsx:199-202"
      behaviour: >-
        `fixed z-50 bottom-24 right-4 … max-h-[520px]`. CSS `position: fixed` is
        anchored to the LAYOUT viewport, which the soft keyboard does not shrink
        on either mobile engine. So the panel keeps its full 520 px, the keyboard
        covers its BOTTOM, and the browser scrolls the focused composer into
        view. The end the citizen loses is the composer's, and the browser gives
        it back.
    flutter:
      citation: "chat_panel.dart chatPanelAvailableHeight, app_shell.dart:129"
      behaviour: >-
        `AppShell.floatingAction` is `Scaffold.floatingActionButton`, positioned
        by `FloatingActionButtonLocation.endFloat`, which participates in
        `resizeToAvoidBottomInset`. The framework shrinks the body and pushes the
        slot UP, so an unclamped 520 dp child loses its TOP — the end holding
        close, minimise and `endConversation`. Measured before the fix:
        `LTRB(16, -28, 374, 492)` at 390x844 with a 336 dp keyboard, and
        `LTRB(16, -196, 344, 324)` at 360x640 with 300. Nothing threw, nothing
        overflowed, and no scroll recovered it.
        The port therefore clamps the cap to
        `min(520, screenHeight - viewInsets.bottom - kFloatingActionButtonMargin)`
        with the transcript as the flexible region, which makes the origin
        non-negative by construction. After the fix: `LTRB(16, 0, 374, 492)` and
        `LTRB(16, 0, 344, 324)`.
    disposition: >-
      FIXED as to the origin, RECORDED as to the residue. The residue is that the
      port's panel is SHORTER with the keyboard up (492 dp / 324 dp) where the
      web's stays 520 and is merely occluded. That difference cannot be
      eliminated — it is the platform's, not the port's — but it is bounded: the
      520 dp cap is preserved wherever 520 dp exists, so every keyboard-down
      case is byte-for-byte unchanged, including the one that looks like a bug
      and is not (see below).
    the_case_that_must_not_be_improved: >-
      At 360x640 with NO keyboard the panel's top is 24, i.e. 32 dp under a 56 dp
      app bar. A 640 px web viewport computes the same top of 24 from
      `bottom-24` + `max-h-520`, so the overlap is FAITHFUL and the clamp
      deliberately does not touch it — `chatPanelAvailableHeight` does not
      subtract `padding.top` for exactly this reason. A port that is better than
      its source is a divergence no fidelity tier can see, which is the same
      blindness that let BLOCKER-1 ship.
    a_second_divergence_created_by_the_fix: >-
      Clamping gave the signed-out branch a problem it did not have: header 60 dp
      + `ChatSignInPrompt` 304 dp = 364 against a 324 dp clamp at 360x640/300, a
      40 dp `RenderFlex` overflow. The prompt is now `Flexible` inside a
      `SingleChildScrollView`. There is no source behaviour being diverged from —
      the web's cap is measured against a viewport the keyboard does not shrink,
      so a 364 px prompt never approaches 520 and `overflow-hidden` (`:199`)
      never fires — so the disposition was chosen on merit: a scroller keeps the
      sign-in button, the entire purpose of that state, reachable, where clipping
      would put it under the fold with no way back. Layout-neutral where the room
      exists; `maxScrollExtent` is 0 at 390x844 and asserted.
    gated_by: >-
      test/features/chat/presentation/chat_panel_keyboard_geometry_test.dart —
      eight tests through the real `AppShell.floatingAction` seam at 390x844 and
      360x640, at insets 0/336/300. Verified RED against the pre-fix tree on four
      of them. THE FOURTH IS NOT ONE OF THE NUMBERS ABOVE and is named here
      because the architecture review's table never measured that state: it is
      the SIGNED-OUT case at 360x640 with a 300 dp keyboard, whose top was
      **-40** before the fix — header 60 + `ChatSignInPrompt` 304 = 364 against a
      contentBottom of 340 — not the -28 or -196 of the signed-in rects. Recorded
      by the mobile lead who measured it; corrected here on their report because
      an unnamed fourth reads as a rounding of the three that were tabulated.
      It also pins the faithful 24 dp overlap and
      the reason `MediaQuery` is used rather than `LayoutBuilder` (the FAB slot
      is laid out with `BoxConstraints.loose(<whole Scaffold>)`, so a
      `LayoutBuilder` there is handed 844 with a 336 dp keyboard up and would
      have computed the very 520 that produces the defect).
    owner: >-
      closed. The residual height difference is inherent; if it is ever
      revisited, architecture-review.md § 2 BLOCKER-1 item 4 rules that moving
      the panel to an `Overlay` changes the seam and needs an ADR.
