divergences:
  - id: B9B-DIV-1
    title: A bodyless POST carries a Content-Type header the web's does not
    severity: low
    tier_visibility: >-
      NONE. Tier 0 compares the request BODY, Tier 1 compares text, Tier 2
      compares colour, Tier 3 compares pixels. No tier in this programme can
      observe a request header, which is exactly why this is written down.
    web:
      citation: "lcc-app/src/app/api/client.ts:234-248"
      behaviour: >-
        `const headers = { Accept: "application/json" }`, and
        `headers["Content-Type"] = "application/json"` is set only inside
        `else if (options.body !== undefined)`. `POST /me/chat/threads/{id}/read`
        is `api.post<unknown>(path)` (endpoints.ts:160) with no second argument,
        so it goes out with no body AND no Content-Type.
    flutter:
      citation: "lib/core/network/api_client.dart:257"
      behaviour: >-
        `_send` sets `contentType: 'application/json'` unconditionally for every
        non-form request, so the same POST carries the header.
    affected_calls:
      - "POST /me/chat/threads/{id}/read   (B9b)"
      - "POST /me/notifications/{id}/read  (B9a — recorded there too)"
      - "POST /me/notifications/read-all   (B9a — recorded there too)"
    bodies_match: true
    headers_match: false
    disposition: >-
      RECORDED, NOT FIXED. `lib/core/network/**` is behaviour-frozen
      (SSD § 6.6(c)): additive capability needs architect approval and changed
      behaviour needs an ADR. Making Dio omit the header conditionally is
      changed behaviour on the one file every request in the app goes through,
      to remove a header no observed backend rejects. specs.md § 8.3 lists
      "a Content-Type or other transport change to lib/core/network/** appears
      necessary" as a BLOCKED condition, so touching it here would be out of
      scope twice over.
    owner: software-architect (an ADR), if it is ever worth fixing

  - id: B9B-DIV-2
    title: clockTime renders a fixed 24-hour HH:mm where the web reads the host locale
    severity: low
    # CORRECTED TWICE, and the second correction is the interesting one.
    #
    # This clause first pointed at an oracle that did not exist. The oracle
    # exists now and the clause was still wrong, because it conflated TWO
    # independent dependencies that happen to meet at the same nodes:
    #
    #   TIMEZONE — solved. The fixture's `sent_at` values are zone-naive, and
    #   both ECMAScript and Dart read a zone-less date-time as local, so the
    #   wall clock is 09:14 on any machine. Nothing to exclude.
    #
    #   LOCALE — NOT solved, and zone-naiveness does not touch it. `:24` passes
    #   `[]` to `toLocaleTimeString`, which is the host LOCALE. The port is
    #   stable at `HH:mm`; the WEB is not, and an oracle records what the web
    #   renders. There is no value derivable from the source at `62f8a529` —
    #   only one derivable from whichever laptop ran the derivation.
    #
    # I raised the first as an objection to the second. It was not one: the
    # entry immediately below is the evidence against my own objection, which is
    # the argument for keeping these records readable rather than tidy.
    tier_visibility: >-
      Tier 1 sees the bubble BODIES; the timestamp nodes are excluded from
      `chat.{en,lo}.json` by name (`provenance.not_evaluated["chat.panel.clockTime"]`,
      `CustomerServiceChat.tsx:24`) because the web's value is
      host-locale-dependent and therefore not derivable at a pinned commit. The
      exclusion is COUNTED, not regex-matched — `_splitClocks` takes index 1 of
      each per-`ChatBubble` dump and asserts 6 stamps against the fixture's 6
      messages carrying `sent_at`, 0 for `greeting` — so a stamp that stopped
      rendering fails Tier 1 rather than vanishing into the exclusion. What no
      tier can see is the behaviour on a device whose locale is neither of the
      app's two.
    web:
      citation: "lcc-app/src/app/components/CustomerServiceChat.tsx:24"
      behaviour: >-
        `d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })`. The
        empty locale list means the HOST locale, whatever the device is set to —
        unlike `relativeTime`, which pins `lo-LA` / `en-GB` explicitly at
        Layout.tsx:73.
    flutter:
      citation: "lib/features/chat/presentation/widgets/clock_time.dart"
      behaviour: >-
        Zero-padded 24-hour `HH:mm`, unconditionally. That is what BOTH of the
        app's locales resolve to for that option set — `en-GB` and `lo-LA` are
        both 24-hour — so the two agree for every citizen the app is built for.
        A device set to `en-US` would read `02:05 PM` on the web and `14:05`
        here.
    disposition: >-
      RECORDED, NOT FIXED. Reproducing the host-locale read would make the
      Tier 1 oracle a function of the machine running the test, which is a worse
      trade than a bounded, stated divergence. `DateFormat.Hm(locale)` was
      rejected for a separate reason: `intl`'s date symbols are not initialised
      for `lo` in this app, so it would silently fall back to `en_US`'s pattern
      for the Lao locale — a locale-dependent format bug hiding behind a
      locale-aware API.
    owner: B9b, revisit if a third locale is ever added

  - id: B9B-DIV-3
    title: A date-ONLY sent_at would be read as UTC on the web and local here
    severity: informational
    tier_visibility: NONE — no observed payload reaches this path.
    web:
      behaviour: >-
        ECMAScript parses the date-only form `2026-08-13` as UTC.
    flutter:
      behaviour: >-
        `DateTime.parse('2026-08-13')` is local.
    disposition: >-
      RECORDED, NOT FIXED. `types.ts:744` types `sent_at` as a full ISO
      timestamp and every observed value is one, so nothing reaches this branch.
      Stated because a reader checking `chatClockTime`'s guard should know which
      input it does not cover. Date-TIME forms agree in both languages: no zone
      marker means local on both sides, and an explicit `Z` is honoured on both.
    owner: nobody — reclassify if the wire format ever changes

  - id: B9B-DIV-4
    # QUOTED, and it has to be: `mailto: ` is a `key: value` to a YAML parser,
    # so unquoted this line made the WHOLE FILE unparseable. It was unparseable
    # at `7db61e7` too — found while adding B9B-DIV-8, by running a parser over
    # it, which is apparently the first time anything has. Nothing in the tree
    # loads this file, so a governance artefact that B9-AC-26 makes load-bearing
    # was silently machine-unreadable. That is the Capability Rule's own shape:
    # the record existed, and the capability it was written to provide did not.
    title: "The tel:/mailto: header shortcuts render but do not open anything"
    severity: medium
    tier_visibility: >-
      NONE. Tiers 1-3 see the button; none of them taps it. The VISIBILITY rule
      — hidden until the channel is published (:239, :249) — is ported and
      gated by B9-AC-43; only the action is missing.
    web:
      citation: "lcc-app/src/app/components/CustomerServiceChat.tsx:239-258"
      behaviour: >-
        `<a href={`tel:${supportPhone.replace(/\\s/g, "")}`}>` and
        `<a href={`mailto:${supportEmail}`}>`.
    flutter:
      citation: "lib/features/chat/presentation/widgets/chat_panel.dart"
      behaviour: >-
        The buttons render and hide identically, `chatTelTarget` /
        `chatMailtoTarget` compute the same strings (asserted, including the
        whitespace strip), and the tap is a no-op.
    disposition: >-
      RECORDED, NOT FIXED. Opening a platform URI needs `url_launcher`, which
      this app does not declare, and specs.md § 4.3 is categorical: "B9 adds
      none. Zero." B2c took the same disposition for the same two channel kinds
      in `support_channel_tile.dart`.
    worse_than_b2c_and_here_is_why: >-
      In the help centre the channel value is on screen verbatim, so a citizen
      can still dial it by hand. In the chat header it is only in the button's
      tooltip. This is therefore a strictly larger gap than the one B2c
      accepted, and it is reported as such rather than as an equivalent.
    owner: >-
