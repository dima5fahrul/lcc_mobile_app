  - id: B9B-DIV-7
    title: >-
      Dart's ISO parser accepts legacy/loose formats JS accepts, and rejects
      some JS accepts — the residue after the rollover guard
    severity: informational
    tier_visibility: NONE — no observed payload reaches either branch.
    found_by: measurement, and it CORRECTED A PREMISE IN specs.md § 6.13
    the_premise_that_was_wrong: >-
      § 6.13 frames the whole `clockTime` difficulty as "a Dart `DateTime.parse`
      on a malformed string THROWS where JS yields NaN", which makes `tryParse`
      look like the complete answer. Measured, it is not: Dart's parser ROLLS
      OUT-OF-RANGE COMPONENTS OVER rather than rejecting them, so
      `2026-02-30T10:00:00Z` becomes March 2nd and `2026-13-45T99:99:99` becomes
      February 2027 — both of which are `Invalid Date` in ECMAScript and render
      `""` in the source. A tryParse-only port prints a plausible, WRONG time
      where the web prints nothing, which is quieter than a crash and harder to
      notice.
    fixed_not_recorded: >-
      This half IS fixed, inside B9b's own scope:
      `clock_time.dart`'s `_componentsSurvivedParsing` compares the calendar
      fields written in the string against the ones the parser returned, so the
      port now renders `""` for both. Asserted in `clock_time_test.dart`,
      including the 2024-02-29 / 2026-02-29 leap-year pair, which is the sharpest
      evidence the check reads the parser's output rather than the string.
    what_remains_open: >-
      The OTHER direction. ECMAScript falls back to implementation-defined
      parsing for non-ISO forms, so `new Date("Aug 13 2026")` is a real date in
      a browser and `DateTime.tryParse` returns null for it — the web would
      render a time and the port renders `""`. Implementing JS's legacy date
      parser is plainly out of scope, and `types.ts:744` types `sent_at` as an
      ISO timestamp, so nothing on the wire reaches it.
    owner: >-
      nobody, unless the backend ever sends a non-ISO timestamp — at which point
      the correct fix is on the wire, not in a formatter

