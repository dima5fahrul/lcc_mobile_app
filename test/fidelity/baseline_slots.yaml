# baseline_slots.yaml — the fidelity baseline slot register.
#
# RULING 11 (GOR-245-f0-form-kernel/specs.md § 6.8.5) and ADR-0006.
# One row per slot PER LOCALE. `len(register)` is the bound: no
# cardinality literal appears in any test (F0-AC-99).
#
# Provenance is THREE FIELDS, not a two-value class (ADR-0006 § 'Why
# two provenance classes are not enough'):
#   build              which build rendered the pixels
#   session            what the renderer was signed in as
#   state_conditional  whether the render depends on account state,
#                      making it one of several valid renders
#
# The first hash set is a BASELINE OF RECORD, NOT A VERIFICATION.
# It establishes immutability prospectively. It cannot prove slots
# 01-15 were untouched between B2c and today, and nothing can:
# manifest.md:221 computed 29 SHA-256s and stored none, and the tree
# is untracked. That gap is F0-NV-9, permanently NOT EVALUATED.
#
# Regenerate: see test/fidelity/README.md § Regenerating the register.

