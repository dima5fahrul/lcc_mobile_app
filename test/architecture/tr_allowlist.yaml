# tr_allowlist.yaml — G-L8's shrinking allowlist (B10 § 6.7.4).
#
# Every entry is one `.tr()` call in `lib/**` that does NOT pass
# `context:` and therefore reads `Localization.instance`, a global,
# registering no `InheritedWidget` dependency. That is D-3.
#
# ── THE ONE RULE ─────────────────────────────────────────────────
#
# **ADDING AN ENTRY TO MAKE A BUILD PASS IS FORBIDDEN.**
#
# This list is a CEILING, not a registry. It exists because B10 could
# not migrate ~300 pre-existing sites across four concurrently-authored
# batches without becoming unmergeable (§ 6.7.3), and a guard that
# failed on all of them would have been switched off within a day
# (§ 6.7.4). It converts an unbounded backlog into a countable one.
#
# If G-L8 fails on your new code, the fix is `.tr(context: context)`.
# If your widget has no context — a BLoC, a mapper, a `static final` —
# then the string is being resolved outside the widget tree and that is
# its own defect (GG-3); raise it, do not list it.
#
# Every batch after B10 leaves this file SHORTER than it found it.
# `tr_allowlist_test.dart` asserts the count never grows.
#
# ── HOW ENTRIES MATCH ────────────────────────────────────────────
#
# `file` + `key`, as a multiset — N bare calls on the same key in the
# same file need N entries. `line` is recorded for navigation and is
# NOT the match key: this tree has concurrent writers, and a
# line-keyed list goes stale the moment somebody adds a comment above
# a listed call. See `glL8Violations`' DECLARED DEVIATION note.
#
# Regenerate (to SHRINK only): dart run tool/generate_tr_allowlist.dart

