name: lcc_mobile_app
description: "LCC citizen portal — Flutter mobile client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization
  easy_localization: ^3.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0

  # DI
  get_it: ^8.0.3

  # Functional error handling
  dartz: ^0.10.1

  # Routing
  go_router: ^16.0.0

  # Network (Dio only — per project decision, no `http`)
  dio: ^5.8.0

  # SVG rendering (§ 6.3 — the lucide icon layer and the R-24 language flags)
  flutter_svg: ^2.2.1

  # Debug
  chucker_flutter: ^1.9.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # File picking (F1 — specs.md § 4.3, and F1 adds exactly ONE dependency)
  #
  # Resident has four mandatory upload controls plus the applicant photo, and
  # nothing already here can open a picker. F0 § 4.3 adds none and defers this
  # by name: *"F1 adds it, with its own justification."*
  #
  # **`FileType.custom` + `allowedExtensions` is FORBIDDEN** (specs.md § 6.7,
  # `F1-AC-44`). R-21: the web's `accept="image/*"` filters the picker's default
  # view and rejects nothing — `handleFile` (`ResidentCertificatePage.tsx:213-221`)
  # inspects neither `type` nor `size`, so **a `.pdf` picked on the Resident
  # form must reach the attachment list**. `FileType.custom` is a hard filter
  # with no escape hatch and would introduce a rejection the web does not have,
  # on the one page where doing so is most tempting.
  file_picker: ^10.0.0

  # Code-gen annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.10.1
  freezed: ^3.2.3
  json_serializable: ^6.10.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
    # Two entries, not the single `- assets/icons/` § 6.3.3 asks for: Flutter's
    # asset-directory declaration is NOT recursive, so `- assets/icons/` alone
    # bundles nothing (both SVG sets live one level down). See qa notes.
    - assets/icons/lucide/
    - assets/icons/flags/
  fonts:
    - family: NotoSansLao
      fonts:
        - asset: assets/fonts/NotoSansLao-Regular.ttf
        - asset: assets/fonts/NotoSansLao-Bold.ttf
          weight: 700
