name: lcc_mobile_app
description: "LCC citizen portal — Flutter mobile client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization
  easy_localization: ^3.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0

  # DI
  get_it: ^8.0.3

  # Functional error handling
  dartz: ^0.10.1

  # Routing
  go_router: ^16.0.0

  # Network (Dio only — per project decision, no `http`)
  dio: ^5.8.0

  # SVG rendering (§ 6.3 — the lucide icon layer and the R-24 language flags)
  flutter_svg: ^2.2.1

  # Debug
  chucker_flutter: ^1.9.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # File picking (F1 — specs.md § 4.3, and F1 adds exactly ONE dependency)
  #
  # Resident has four mandatory upload controls plus the applicant photo, and
  # nothing already here can open a picker. F0 § 4.3 adds none and defers this
  # by name: *"F1 adds it, with its own justification."*
  #
  # **`FileType.custom` + `allowedExtensions` is FORBIDDEN** (specs.md § 6.7,
  # `F1-AC-44`). R-21: the web's `accept="image/*"` filters the picker's default
  # view and rejects nothing — `handleFile` (`ResidentCertificatePage.tsx:213-221`)
  # inspects neither `type` nor `size`, so **a `.pdf` picked on the Resident
  # form must reach the attachment list**. `FileType.custom` is a hard filter
  # with no escape hatch and would introduce a rejection the web does not have,
  # on the one page where doing so is most tempting.
  file_picker: ^10.0.0

  # Code-gen annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  equatable: ^2.0.7

  # Certificate QR — the e-certificates API guide (MOBILE-API-E-CERTIFICATES.md,
  # 2026-10, § Citizen endpoints, QR) makes "draw `payload` as the QR on screen"
  # a product requirement for the certificate's own QR in the document viewer.
  # Nothing already in the tree encodes a QR — payment's QrPlaceholder is
  # deliberately decorative and argument-less — so an encoder is needed. Scoped
  # to the certificate payload only; the payment placeholder stays untouched.
  qr_flutter: ^4.1.0

  # Platform PDF viewer — the guide's File paragraph: "store the bytes, and
  # open them in the platform PDF viewer". `open_filex` is the open handoff
  # (with its own file-type resolution); `path_provider` supplies the
  # temporary directory the downloaded PDF is stored in before opening.
  open_filex: ^4.0.0
  path_provider: ^2.1.0

  # SHA-256 — the guide's `X-Content-SHA256` integrity header must be verified
  # against the downloaded bytes before anything is opened or saved
  # (Task 6's `sha256Matches`). Already resolved transitively in
  # pubspec.lock (3.0.7); this promotes it to a direct dependency for
  # `certificate_pdf_io.dart`. Task 7's on-device hash check reuses it.
  crypto: ^3.0.0

  # QR scanner — the guide's § QR codes and deep links names the camera path
  # ("a citizen scans the certificate's printed QR") as the other half of
  # verification alongside the typed-code entry page (Task 4). Nothing already
  # in the tree opens a camera preview; `mobile_scanner` is the one new
  # dependency Task 5 adds, consumed only by `VerifyScannerPage` and gated by
  # the SAME `certificateCodeFromScanned` parser the typed path uses, so a
  # non-certificate QR (rule 3) never reaches the API through this camera path
  # either.
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.10.1
  freezed: ^3.2.3
  json_serializable: ^6.10.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1

  # Launcher-icon generation and the platform-rename CLI (GOR-268).
  #
  # BUILD-TIME ONLY, and dev-only on purpose: neither may reach the release
  # closure (specs.md B-7, the chucker_flutter precedent B11-AC-29/-30/-31).
  #
  # EXACT-PINNED, not caret-ranged, on two independent grounds: security-review.md
  # § V-G requires it, and AC-18 requires re-running generation from the committed
  # source to reproduce the committed icon set — a caret range silently produces a
  # different icon set from the same input six months from now.
  #
  # `rename` is declared but deliberately NOT USED: measured against this tree it
  # changes applicationId without the namespace/Kotlin-package/file-move coupling
  # (IMP-1), and collapses the three iOS `.RunnerTests` bundle ids onto the app's.
  # See decisions.md § 1.2 for the evidence. Every rename edit here is by hand.
  flutter_launcher_icons: 0.14.4
  rename: 3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
    # Two entries, not the single `- assets/icons/` § 6.3.3 asks for: Flutter's
    # asset-directory declaration is NOT recursive, so `- assets/icons/` alone
    # bundles nothing (both SVG sets live one level down). See qa notes.
    - assets/icons/lucide/
    - assets/icons/flags/
  fonts:
    - family: NotoSansLao
      fonts:
        - asset: assets/fonts/NotoSansLao-Regular.ttf
        - asset: assets/fonts/NotoSansLao-Bold.ttf
          weight: 700
